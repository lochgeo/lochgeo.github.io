<!DOCTYPE html>
<html lang="en">
  <head>
    <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.name }} – {{ site.description }}</title>
    {% seo title=false %}
    {% include meta.html %}

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400..700&display=swap" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
    <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/assets/style.css" />
    <link rel="alternate" type="application/rss+xml" title="{{ site.name }} - {{ site.description }}" href="{{ site.baseurl }}/feed.xml" />
    <link rel="canonical" href="{{ site.url }}{{ page.url }}" />

    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#181c25">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ site.baseurl }}/images/favicon-32x32.png">
    {% include analytics_head.html %}
  </head>

  <body>
    <header class="site-header">
      <nav class="container">
        <ul>
          <li>
            <a href="{{ site.baseurl }}/" class="site-brand">
              <img src="{{ site.baseurl }}{{ site.avatar }}" alt="" /> <span class="brand-name">{{ site.name }}</span>
            </a>
          </li>
        </ul>
        <ul>
          <li><a href="{{ site.baseurl }}/">Home</a></li>
          <li><a href="{{ site.baseurl }}/search">Search</a></li>
          <li><a href="{{ site.baseurl }}/reading">Reading</a></li>
          <li><a href="{{ site.baseurl }}/about">About</a></li>
          <li><a href="{{ site.baseurl }}/archive">Archive</a></li>
        </ul>
      </nav>
    </header>

    <main class="container">
      {{ content }}
    </main>

    <footer class="container">
      {% include svg-icons.html %}
      <p class="footer-copy">&copy; {{ site.author }} {{ "now" | date: "%Y" }}</p>
    </footer>
  </body>
</html>
